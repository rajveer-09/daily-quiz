services:
  - type: web
    name: quiz-me
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://bigonotes.vercel.app
      - key: QUIZ_TZ
        value: Asia/Kolkata
      - key: DB_NAME
        sync: false
      # Secrets: Render asks for these when you create the service from this file.
      - key: MONGODB_URI
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
